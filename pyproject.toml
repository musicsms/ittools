[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ittools"
version = "0.2.0"
description = "A standard CLI toolkit of IT, PKI, and SSL/TLS utilities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
    "paramiko>=3.4.0",
    "python-gnupg>=0.5.2",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]
ntlm = [
    "requests-ntlm>=1.2.0",
]

[project.scripts]
ittools = "ittools.cli.main:main"
